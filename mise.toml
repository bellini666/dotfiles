[dotfiles]
# Sources are relative to this file (~/.dotfiles). Default mode is symlink.
"~/.config/mise/config.toml" = "mise/config.toml"
"~/.claude/CLAUDE.md" = "agents/AGENTS.md"
"~/.config/opencode/AGENTS.md" = "agents/AGENTS.md"
"~/.codex/AGENTS.md" = "agents/AGENTS.md"
"~/.claude/settings.json/shared" = { source = "agents/claude.json", merge = true }
"~/.claude/plugins/claude-hud/config.json" = { source = "agents/claude-hud.json", mode = "copy" }
"~/.config/opencode/opencode.json" = "agents/opencode.json"
"~/.codex/config.toml/shared" = { source = "agents/codex.toml", merge = true }
"~/.config/opencode/skills" = "agents/skills"
"~/.agents/plugins/marketplace.json" = "agents/marketplace.json"
"~/.config/ghostty" = "ghostty"
"~/.config/herdr/config.toml/shared" = { source = "herdr/config.toml", merge = true }
"~/.config/herdr-auto-title/config.env" = "herdr/auto-title.env"
"~/.gitattributes" = "git/gitattributes"
"~/.gitconfig" = "git/gitconfig"
"~/.gitignore" = "git/gitignore"
"~/.config/kitty" = "kitty"
"~/.pdbrc.py" = "python/pdbrc.py"
"~/.config/starship.toml" = "starship/starship.toml"
"~/.config/nvim" = "vim"
"~/.zsh_plugins.txt" = "zsh/zsh_plugins.txt"
"~/.zshrc" = "zsh/zshrc"
"~/.zshenv" = "zsh/zshenv"
"~/.secret_env.sh" = { permissions = "0600" }

[bootstrap.hooks.final]
run = """
mise prune -y
zsh -i -c "antidote update -b"
"""

[tasks.bootstrap]
description = "Configure agents and the tools that integrate with them"
depends = ["agents:plugins"]
run = """
rtk init -g --hook-only --auto-patch
herdr integration install claude
herdr plugin install kryptamine/herdr-auto-title -y
herdr plugin install hhdebb/herdr-radar -y
"""

[tasks."agents:plugins"]
description = "Refresh the shared Codex plugin and its hook trust"
depends = ["agents:install"]
run = "node agents/sync-codex-plugin.js"

[tasks."agents:install"]
description = "Install or update Claude Code and Codex"
run = '''
set -eu
agent_install_dir=$(mktemp -d)
trap 'rm -rf "$agent_install_dir"' EXIT

if command -v claude >/dev/null 2>&1; then
  claude update
else
  curl -fsSL https://claude.ai/install.sh -o "$agent_install_dir/claude.sh"
  bash "$agent_install_dir/claude.sh"
fi

curl -fsSL https://chatgpt.com/codex/install.sh -o "$agent_install_dir/codex.sh"
CODEX_NON_INTERACTIVE=1 sh "$agent_install_dir/codex.sh"
'''
