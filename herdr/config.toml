onboarding = false

[theme]
name = "kanagawa"
dark_name = "kanagawa"
light_name = "kanagawa"

[update]
# mise owns the herdr version (mise/config.toml: herdr = 'latest').
version_check = false

[ui]
show_agent_labels_on_pane_borders = true
agent_panel_sort = "priority"
status_indicators = "symbols"
window_title = "🐐 {hostname} | {workspace}"

[ui.sound]
enabled = false

[ui.toast]
delivery = "system"

[experimental]
pane_history = true
switch_ascii_input_source_in_prefix = true

[keys]
previous_tab = "alt+left"
next_tab = "alt+right"
previous_workspace = "alt+shift+up"
next_workspace = "alt+shift+down"
previous_agent = "alt+up"
next_agent = "alt+down"
new_tab = "prefix+t"
focus_pane_left = "prefix+left"
focus_pane_down = "prefix+down"
focus_pane_up = "prefix+up"
focus_pane_right = "prefix+right"

[[keys.command]]
key = "ctrl+alt+k"
type = "plugin_action"
command = "herdr-bar.open"
description = "command bar"

[[keys.command]]
key = "prefix+d"
type = "popup"
command = "cd \"${HERDR_ACTIVE_PANE_CWD:-$PWD}\" && exec tuicr"
description = "review with tuicr"
width = "95%"
height = "95%"
