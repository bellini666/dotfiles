"apt:gh" = "latest"
"apt:git" = "latest"
"apt:git-delta" = "latest"
"apt:htop" = "latest"
"apt:jq" = "latest"
"apt:kubectl" = "latest"
"apt:kubetail" = "latest"
"apt:lazygit" = "latest"
"apt:libbz2-dev" = "latest"
"apt:libffi-dev" = "latest"
"apt:liblzma-dev" = "latest"
"apt:libncurses-dev" = "latest"
"apt:libreadline-dev" = "latest"
"apt:libsox-fmt-mp3" = "latest"
"apt:libsqlite3-dev" = "latest"
"apt:libssl-dev" = "latest"
"apt:libtool-bin" = "latest"
"apt:libxml2-dev" = "latest"
"apt:libxmlsec1-dev" = "latest"
"apt:locales" = "latest"
"apt:ncdu" = "latest"
"apt:ninja-build" = "latest"
"apt:pgcli" = "latest"
"apt:pipx" = "latest"
